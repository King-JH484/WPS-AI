<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>灵犀AI Add-in Entry</title>
    <script>
      (function loadEntryScript() {
        var dev = /^(?:localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);
        document.write('<script src="./main.js' + (dev ? '?v=' + Date.now() : '') + '"><\/script>');
      })();
    </script>
  </head>
  <body></body>
</html>
<!-- 参考 wpsjs_demo：index.html 是 WPS 加载项入口文件，WPS 启动加载项时会先加载此文件。 -->
