<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Anthony AI Add-in Entry</title>
    <script>
      (function installWpsCallbackCompatibility() {
        var global = window;
        function patchWpsApi(api) {
          if (!api || (typeof api !== "object" && typeof api !== "function")) return api;
          var names = ["WrapCallbackArg", "JS2Variant", "Variant2JS"];
          for (var i = 0; i < names.length; i += 1) {
            var name = names[i];
            if (typeof api[name] === "function") continue;
            try {
              api[name] = function identityVariantBridge(value) {
                return value;
              };
            } catch (e) {}
          }
          return api;
        }

        var fallback = patchWpsApi({});
        if ("wps" in global) {
          try {
            if (global.wps == null) global.wps = fallback;
            else patchWpsApi(global.wps);
          } catch (e) {}
          return;
        }
        try {
          Object.defineProperty(global, "wps", {
            configurable: true,
            enumerable: true,
            get: function getWps() {
              return fallback;
            },
            set: function setWps(value) {
              Object.defineProperty(global, "wps", {
                configurable: true,
                enumerable: true,
                writable: true,
                value: patchWpsApi(value)
              });
            }
          });
        } catch (e) {
          global.wps = fallback;
        }
      })();

      (function installEarlyRibbonCallbacks() {
        var global = window;
        global.__anthonyRibbonEarlyQueue = global.__anthonyRibbonEarlyQueue || [];
        function tracePayload(value) {
          if (value == null) return "";
          if (typeof value === "string") return value;
          try { return JSON.stringify(value); } catch (e) { return String(value); }
        }
        global.__anthonyTraceStatic = global.__anthonyTraceStatic || function traceStatic(event, data) {
          try {
            var url = new URL(location.href);
            var basePath = url.pathname.replace(/\/[^/]*$/, "/");
            var img = new Image();
            img.src = basePath + "__anthony_trace__.gif?event=" + encodeURIComponent(event || "")
              + "&data=" + encodeURIComponent(tracePayload(data))
              + "&ts=" + Date.now();
          } catch (e) {}
          try { console.log("[anthony-ribbon-trace]", event, data); } catch (e) {}
        };
        global.__anthonyGetRibbonControlId = global.__anthonyGetRibbonControlId || function getRibbonControlId(control) {
          if (typeof control === "string") return control;
          if (!control) return "";
          var keys = ["Id", "id", "ID", "Name", "name"];
          for (var i = 0; i < keys.length; i += 1) {
            try {
              var value = control[keys[i]];
              if (typeof value === "function") value = value.call(control);
              if (value != null && value !== "") return String(value);
            } catch (e) {}
          }
          return "";
        };

        global.__anthonyInvokeRibbonById = global.__anthonyInvokeRibbonById || function invokeRibbonById(id) {
          global.__anthonyTraceStatic("early.invokeById", id);
          if (typeof global.__anthonyOnAction === "function") {
            return global.__anthonyOnAction(id);
          }
          if (id) {
            global.__anthonyRibbonEarlyQueue.push({ type: "action", id: id, ts: Date.now() });
          }
          return true;
        };

        global.__anthonyGetRibbonImageById = global.__anthonyGetRibbonImageById || function getRibbonImageById(id) {
          global.__anthonyTraceStatic("early.getImageById", id);
          if (typeof global.__anthonyGetImage === "function") {
            return global.__anthonyGetImage(id);
          }
          return "images/ai.png";
        };

        global.__anthonyBindRibbonAction = global.__anthonyBindRibbonAction || function bindRibbonAction(fnName, id) {
          global.__anthonyTraceStatic("early.bindAction", { fnName: fnName, id: id });
          window[fnName] = function generatedRibbonAction() {
            global.__anthonyTraceStatic("early.generatedAction", { fnName: fnName, id: id });
            return global.__anthonyInvokeRibbonById(id);
          };
        };

        global.__anthonyBindRibbonImage = global.__anthonyBindRibbonImage || function bindRibbonImage(fnName, id) {
          global.__anthonyTraceStatic("early.bindImage", { fnName: fnName, id: id });
          window[fnName] = function generatedRibbonImage() {
            global.__anthonyTraceStatic("early.generatedImage", { fnName: fnName, id: id });
            return global.__anthonyGetRibbonImageById(id);
          };
        };

        // ribbon 国际化：getLabel 回调按当前界面语言返回翻译（i18n 未加载 / 词典没有时回退中文）。
        // 语言切换时 i18n.js 会调 __anthonyRibbonUI.Invalidate() 让 WPS 重新拉一遍 label。
        global.__anthonyBindRibbonLabel = global.__anthonyBindRibbonLabel || function bindRibbonLabel(fnName, zhLabel) {
          window[fnName] = function generatedRibbonLabel() {
            try {
              if (global.WpsAiI18n && typeof global.WpsAiI18n.t === "function") return global.WpsAiI18n.t(zhLabel);
            } catch (e) {}
            return zhLabel;
          };
        };

        window.OnAddinLoad = function OnAddinLoad(ribbonUI) {
          global.__anthonyTraceStatic("early.OnAddinLoad", !!ribbonUI);
          global.__anthonyRibbonUI = ribbonUI;
          if (typeof global.__anthonyOnAddinLoad === "function") {
            return global.__anthonyOnAddinLoad(ribbonUI);
          }
          return true;
        };

        window.OnAction = function OnAction(control) {
          var id = global.__anthonyGetRibbonControlId(control);
          global.__anthonyTraceStatic("early.OnAction", id);
          if (typeof global.__anthonyOnAction === "function") {
            return global.__anthonyOnAction(control);
          }
          if (id) {
            global.__anthonyRibbonEarlyQueue.push({ type: "action", id: id, ts: Date.now() });
          }
          return true;
        };

        window.GetImage = function GetImage(control) {
          global.__anthonyTraceStatic("early.GetImage", global.__anthonyGetRibbonControlId(control));
          if (typeof global.__anthonyGetImage === "function") {
            return global.__anthonyGetImage(control);
          }
          return "images/ai.png";
        };

        window.OnGetEnabled = function OnGetEnabled(control) {
          var id = global.__anthonyGetRibbonControlId(control);
          global.__anthonyTraceStatic("early.OnGetEnabled", id);
          if (typeof global.__anthonyOnGetEnabled === "function") {
            return global.__anthonyOnGetEnabled(control);
          }
          return true;
        };

        window.OnGetVisible = function OnGetVisible(control) {
          var id = global.__anthonyGetRibbonControlId(control);
          global.__anthonyTraceStatic("early.OnGetVisible", id);
          if (typeof global.__anthonyOnGetVisible === "function") {
            return global.__anthonyOnGetVisible(control);
          }
          return true;
        };

        global.__anthonyTraceStatic("early.shell.ready", location.pathname);
      })();

      (function loadEntryScript() {
        var dev = /^(?:localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);
        var cacheBust = dev ? '?v=' + Date.now() : '';
        document.write('<script src="./js/ribbon-callbacks.generated.js' + cacheBust + '"><\/script>');
        document.write('<script src="./main.js' + cacheBust + '"><\/script>');
      })();
    </script>
  </head>
  <body></body>
</html>
<!-- 参考 wpsjs_demo：index.html 是 WPS 加载项入口文件，WPS 启动加载项时会先加载此文件。 -->
